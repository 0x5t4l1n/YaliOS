[package]
name = "yali_os"
version = "0.1.0"
edition = "2021"
authors = ["YaliOS contributors"]
description = "The first bootable version of YaliOS"
publish = false

[dependencies]
bootloader = { version = "=0.9.35", features = ["map_physical_memory"] }
spin = "0.9.8"
x86_64 = "=0.14.7"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
build-command = ["build"]
run-command = [
    "qemu-system-x86_64",
    "-drive", "format=raw,file={}",
    "-serial", "stdio",
    "-display", "none"
]
